<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>B-CHAT - スレッド作成</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        B-CHAT<a href="index.html"></a>
    </div>


    <nav class="nav">

        <a href="index.html">
            ホーム
        </a>

        <a href="threads.html">
            スレッド
        </a>

        <a href="search.html">
            検索
        </a>

        <div id="auth-link"></div>

        <a href="profile.html">
            プロフィール
        </a>

    </nav>

</header>



<main>

    <section class="section">


        <div class="page-title">

            <p class="breadcrumb">
                B-CHAT / スレッド作成
            </p>

            <h1>
                スレッドを作成
            </h1>

            <p>
                ボウリングについて質問や情報を投稿できます。
            </p>

        </div>



        <div class="create-thread-box">


            <form id="create-thread-form">


                <!-- ジャンル -->

                <div class="form-group">

                    <label for="category">
                        ジャンル
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            選択してください
                        </option>

                        <option value="ボール">
                            ボール
                        </option>

                        <option value="レーン">
                            レーン
                        </option>

                        <option value="投球">
                            投球
                        </option>

                        <option value="大会">
                            大会
                        </option>

                        <option value="その他">
                            その他
                        </option>

                    </select>

                </div>



                <!-- タイトル -->

                <div class="form-group">

                    <label for="title">
                        タイトル
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="例：初心者におすすめのボールを教えてください"
                        maxlength="100"
                        required
                    >

                </div>



                <!-- 本文 -->

                <div class="form-group">

                    <label for="content">
                        本文
                    </label>

                    <textarea
                        id="content"
                        rows="10"
                        placeholder="質問や知りたいことを書いてください"
                        required
                    ></textarea>

                    <!-- 画像 -->

                        <div class="form-group">

                            <label for="thread-image">
                                画像
                            </label>

                            <input
                                type="file"
                                id="thread-image"
                                accept="image/jpeg,image/png,image/webp"
                            >

                            <p>
                                JPG・PNG・WEBP / 最大10MB
                            </p>

                        </div>


                        <!-- プレビュー -->

                        <div id="image-preview"></div>

                </div>



                <button
                    type="submit"
                    class="auth-button"
                >
                    スレッドを作成
                </button>


            </form>


            <p id="create-thread-message"></p>


        </div>


    </section>

</main>



<footer class="footer">

    <p>
        © 2026 B-CHAT
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/main.js"></script>

<script src="js/create-thread.js"></script>


</body>

</html>
