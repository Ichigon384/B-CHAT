<!DOCTYPE html>
<html lang="ja">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>B-CHAT - 検索</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ========================================
     ヘッダー
======================================== -->

<header class="header">

    <div class="logo">
        B-CHAT<a href="index.html"></a>
    </div>


    <nav class="nav">

        <a href="index.html">

            <button
                id="global-search-button"
                type="button"

        </div>

            id="search-result-count"

            id="search-results"
            class="thread-list"

======================================== -->

<footer class="footer">

</footer>
