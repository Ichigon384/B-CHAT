<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>B-CHAT - スレッド</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ヘッダー -->

    <header class="header">

        <div class="logo">
            B-CHAT<a href="index.html"></a>
        </div>

        <nav class="nav">

            <a href="index.html">
                ホーム
            </a>

            <a href="threads.html">
                スレッド
            </a>

            <a href="search.html">
                検索
            </a>

            <a href="login.html">
                ログイン
            </a>

            <a href="profile.html">
                プロフィール
            </a>

        </nav>

    </header>



    <!-- メイン -->

    <main>

        <section class="section">


            <!-- パンくず -->

            <div class="page-title">

                <p class="breadcrumb">
                    B-CHAT / ボール
                </p>

            </div>



            <!-- スレッド本体 -->

            <article id="thread-detail">

                <p>
                    スレッドを読み込んでいます...
                </p>

            </article>



            <!-- 返信 -->

            <section class="replies">

                <h2>
                    返信
                </h2>

                <div id="reply-list">

                    <p>
                        返信を読み込んでいます...
                    </p>

                </div>

                <!-- 返信投稿 -->

<div id="reply-form-area">

    <h2>
        返信する
    </h2>


    <form id="reply-form">

    <textarea
        id="reply-content"
        rows="5"
        placeholder="返信を書く..."
    ></textarea>


    <div class="reply-image-input">

        <label for="reply-image">
            画像を添付
        </label>

        <input
            type="file"
            id="reply-image"
            accept="image/jpeg,image/png,image/webp"
        >

        <p>
            JPG・PNG・WEBP / 最大10MB
        </p>

    </div>


    <div id="reply-image-preview"></div>


    <button type="submit">
        返信
    </button>


    <p id="reply-message"></p>

</form>

            </section>


        </section>

    </main>



    <!-- フッター -->

    <footer class="footer">

        <p>
            © 2026 B-CHAT
        </p>

    </footer>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/main.js"></script>

    <script src="js/thread.js"></script>

</body>

</html>
